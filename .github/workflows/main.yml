name: Build VideoStar Macro Tweak

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Compile .m to .o & Link .dylib
    runs-on: macos-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Cài đặt dpkg
        run: |
          brew install dpkg

      - name: 3. Lấy SDK iOS từ Xcode
        id: sdk
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK_PATH=$SDK_PATH" >> $GITHUB_ENV

      - name: 4. Biên dịch từng file .m thành file đối tượng .o
        run: |
          mkdir -p build/obj
          CFLAGS="-isysroot ${{ env.SDK_PATH }} -arch arm64 -arch arm64e -miphoneos-version-min=14.0 -fobjc-arc -O2"

          echo ">>> 1/4 VSPassthroughWindow.m -> .o"
          clang $CFLAGS -c VSPassthroughWindow.m -o build/obj/VSPassthroughWindow.o

          echo ">>> 2/4 VSFloatingButton.m -> .o"
          clang $CFLAGS -c VSFloatingButton.m -o build/obj/VSFloatingButton.o

          echo ">>> 3/4 VSMacroEngine.m -> .o"
          clang $CFLAGS -c VSMacroEngine.m -o build/obj/VSMacroEngine.o

          echo ">>> 4/4 Tweak.m -> .o"
          clang $CFLAGS -c Tweak.m -o build/obj/Tweak.o

          ls -lh build/obj/

      - name: 5. Liên kết các file .o thành VideoStarRecorder.dylib
        run: |
          mkdir -p build/dylib
          LDFLAGS="-isysroot ${{ env.SDK_PATH }} -arch arm64 -arch arm64e -miphoneos-version-min=14.0 -shared -fobjc-arc"
          FRAMEWORKS="-framework UIKit -framework Foundation -framework CoreGraphics -framework QuartzCore"

          clang $LDFLAGS $FRAMEWORKS \
            build/obj/VSPassthroughWindow.o \
            build/obj/VSFloatingButton.o \
            build/obj/VSMacroEngine.o \
            build/obj/Tweak.o \
            -o build/dylib/VideoStarRecorder.dylib

          codesign -f -s - build/dylib/VideoStarRecorder.dylib
          ls -lh build/dylib/VideoStarRecorder.dylib

      - name: 6. Đóng gói thành file .deb
        run: |
          mkdir -p build/deb_package/DEBIAN
          mkdir -p build/deb_package/Library/MobileSubstrate/DynamicLibraries

          cp control build/deb_package/DEBIAN/control
          cp build/dylib/VideoStarRecorder.dylib build/deb_package/Library/MobileSubstrate/DynamicLibraries/
          cp VideoStarRecorder.plist build/deb_package/Library/MobileSubstrate/DynamicLibraries/

          dpkg-deb -Zgzip --root-owner-group -b build/deb_package build/VideoStarRecorder.deb

      - name: 7. Tải lên Artifacts để tải về
        uses: actions/upload-artifact@v4
        with:
          name: VideoStarRecorder-Release
          path: |
            build/obj/*.o
            build/dylib/*.dylib
            build/*.deb
          retention-days: 7
