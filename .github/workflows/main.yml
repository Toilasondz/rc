name: Build VideoStar Macro Tweak

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Cho phép bấm nút "Run workflow" thủ công trên giao diện web GitHub

jobs:
  build:
    name: Compile .o, .dylib & Package .deb
    runs-on: macos-latest

    steps:
      - name: 1. Checkout mã nguồn
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 2. Cài đặt môi trường Theos & iOS SDK
        uses: themackabu/action-theos@v1.4
        with:
          sdks-repo: 'https://github.com/theos/sdks'

      - name: 3. Biên dịch các file .m và .xm thành các file .o và .dylib
        run: |
          echo "=== BẮT ĐẦU BIÊN DỊCH VỚI THEOS ==="
          make clean
          make FINALPACKAGE=1

      - name: 4. Thu thập và tổ chức các file .o, .dylib, .deb
        run: |
          echo "=== TẠO THƯ MỤC XUẤT OUTPUT ==="
          mkdir -p output/object_files
          mkdir -p output/dylib
          mkdir -p output/deb

          # Sao chép toàn bộ các file .o được sinh ra
          find .theos/obj -type f -name "*.o" -exec cp {} output/object_files/ \;

          # Sao chép file .dylib
          find .theos/obj -type f -name "*.dylib" -exec cp {} output/dylib/ \;

          # Sao chép file gói cài đặt .deb
          if [ -d "packages" ]; then
            cp packages/*.deb output/deb/ 2>/dev/null || true
          fi

          echo "=== DANH SÁCH FILE .O ĐÃ BIÊN DỊCH ==="
          ls -lh output/object_files/
          
          echo "=== FILE .DYLIB ĐÃ LIÊN KẾT ==="
          ls -lh output/dylib/

      - name: 5. Upload Artifacts (Tải về trọn gói từ GitHub Actions)
        uses: actions/upload-artifact@v4
        with:
          name: VideoStarRecorder-Build-Artifacts
          path: output/
          retention-days: 7
